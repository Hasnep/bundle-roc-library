repos:
  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - name: Prevent committing to main
        id: no-commit-to-branch
        args: [--branch, main]
      - name: Make sure files end with a newline character
        id: end-of-file-fixer
        exclude: "dist/.*$"
      - name: Remove trailing whitespace
        id: trailing-whitespace
        exclude: "dist/.*$"
      - name: Check for files that would conflict on case-insensitive filesystem
        id: check-case-conflict
      - name: Check for merge conflicts
        id: check-merge-conflict
      - name: Check executable files have a shebang
        id: check-executables-have-shebangs
      - name: Check scripts with a shebang are executable
        id: check-shebang-scripts-are-executable

  - repo: local
    hooks:
      # TypeScript
      - name: Format TypeScript files
        id: prettier
        language: system
        entry: npm exec -- prettier --write
        types: [ts]
      - name: Lint TypeScript files
        id: eslint
        language: system
        entry: npm exec -- eslint
        types: [ts]

      # YAML
      - name: Format YAML files
        id: prettier
        language: system
        entry: npm exec -- prettier --write
        types: [yaml]

      # JSON
      - name: Format JSON files
        id: prettier
        language: system
        entry: npm exec -- prettier --write
        types: [json]

      # Markdown
      - name: Lint markdown files
        id: rumdl
        language: system
        entry: npm exec -- rumdl check --fix
        types: [markdown]
      - name: Format markdown files
        id: rumdl-fmt
        language: system
        entry: npm exec -- rumdl fmt
        types: [markdown]

  # GitHub Actions
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.21.0
    hooks:
      - name: Validate GitHub Actions workflow files
        id: check-github-workflows
      - name: Validate GitHub Actions file
        id: check-github-actions

  # Pre-commit
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.21.0
    hooks:
      - name: Validate Pre-commit config
        id: check-jsonschema
        files: ^.*\.pre-commit-config.yaml$
        args:
          [
            "--schemafile",
            "https://json.schemastore.org/pre-commit-config.json",
          ]
